name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, contracts and database
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: mall_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mall_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      ALLOW_CI_EPHEMERAL_POSTGRES: "1"
      DATABASE_URL: postgresql://mall_runtime:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-runtime@127.0.0.1:5432/mall_ci_test
      DIRECT_URL: postgresql://mall_migrator:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}@127.0.0.1:5432/mall_ci_test
      REPLAY_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}@127.0.0.1:5432/mall_ci_test
      REDIS_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      REDIS_URL: redis://:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}@127.0.0.1:6379/15
      MINIO_ROOT_USER: ci-${{ github.run_id }}
      MINIO_ROOT_PASSWORD: ci-minio-root-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: mall-b3-ci-${{ github.run_id }}-${{ github.run_attempt }}
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/mall-b3-ci-${{ github.run_id }}-${{ github.run_attempt }}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-access-${{ github.run_id }}-${{ github.run_attempt }}
      S3_SECRET_KEY: ci-s3-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_BATCH_SIZE: "20"
      WORKER_MAX_RETRIES: "8"
      WORKER_BASE_RETRY_DELAY_MS: "1000"
      AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
      AUTH_PREAUTH_TOKEN_TTL_SECONDS: "300"
      AUTH_SESSION_TTL_SECONDS: "604800"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install PostgreSQL and Redis clients
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client redis-tools

      - name: Validate local service definition
        run: docker compose config --quiet

      - name: Start Redis and MinIO
        run: docker compose up --detach --wait redis minio

      - name: Wait for Redis and MinIO
        run: scripts/ci/wait-for-services.sh

      - name: Create private CI bucket
        run: docker compose run --rm minio-init

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify bootstrap CLI clean-checkout entry point
        run: |
          bootstrap_output="$(mktemp)"
          trap 'rm -f "$bootstrap_output"' EXIT
          if pnpm admin:bootstrap forbidden-non-secret-argument >"$bootstrap_output" 2>&1; then
            echo 'bootstrap unexpectedly accepted a command-line argument' >&2
            exit 1
          fi
          grep --quiet --line-regexp 'Super administrator bootstrap failed' "$bootstrap_output"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Create CI-only application secrets
        run: |
          echo "FIELD_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo 'FIELD_PREVIOUS_ENCRYPTION_KEYS_JSON=[]' >> "$GITHUB_ENV"
          echo "AUDIT_IP_HASH_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "IDEMPOTENCY_HASH_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "IDEMPOTENCY_HASH_KEY_ID=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo 'IDEMPOTENCY_PREVIOUS_HASH_KEYS_JSON=[]' >> "$GITHUB_ENV"
          echo "BANK_ACCOUNT_HASH_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "BANK_ACCOUNT_HASH_KEY_ID=ci-bank-account-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo 'BANK_ACCOUNT_PREVIOUS_HASH_KEYS_JSON=[]' >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY_ID=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "AUTH_SIGNING_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "AUTH_SIGNING_KEY_ID=ci-auth-sign-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo 'AUTH_PREVIOUS_SIGNING_KEYS_JSON=[]' >> "$GITHUB_ENV"
          echo "AUTH_SECRET_HASH_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "AUTH_SECRET_HASH_KEY_ID=ci-auth-secret-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo 'AUTH_PREVIOUS_SECRET_HASH_KEYS_JSON=[]' >> "$GITHUB_ENV"
          echo 'AUTH_TOKEN_ISSUER=qingxu-api-ci' >> "$GITHUB_ENV"
          echo 'AUTH_TOKEN_AUDIENCE=qingxu-admin-ci' >> "$GITHUB_ENV"
          echo 'AGENT_AUTH_TOKEN_AUDIENCE=qingxu-agent-web' >> "$GITHUB_ENV"
          echo 'AGENT_ACCESS_TOKEN_TTL_SECONDS=900' >> "$GITHUB_ENV"
          echo 'AGENT_SESSION_TTL_SECONDS=604800' >> "$GITHUB_ENV"
          echo 'AGENT_LOGIN_RATE_LIMIT_MAX=10' >> "$GITHUB_ENV"
          echo 'AGENT_LOGIN_RATE_LIMIT_WINDOW_SECONDS=900' >> "$GITHUB_ENV"
          echo 'STORE_AUTH_TOKEN_AUDIENCE=qingxu-store' >> "$GITHUB_ENV"
          echo 'STORE_PROMOTION_PUBLIC_BASE_URL=http://127.0.0.1:4173' >> "$GITHUB_ENV"
          echo 'STORE_IDENTITY_PROVIDER=MOCK' >> "$GITHUB_ENV"
          echo 'STORE_PHONE_PROVIDER=MOCK' >> "$GITHUB_ENV"
          echo "STORE_PHONE_HASH_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "STORE_PHONE_HASH_KEY_ID=ci-store-phone-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo 'STORE_PHONE_PREVIOUS_HASH_KEYS_JSON=[]' >> "$GITHUB_ENV"
          echo 'STORE_WECHAT_APP_ID=qingxu-mock-store-ci' >> "$GITHUB_ENV"
          echo 'STORE_USER_AGREEMENT_VERSION=ci-user-v1' >> "$GITHUB_ENV"
          echo 'STORE_USER_AGREEMENT_TITLE=CI User Agreement' >> "$GITHUB_ENV"
          echo 'STORE_USER_AGREEMENT_URL=https://example.invalid/legal/user-agreement' >> "$GITHUB_ENV"
          echo 'STORE_PRIVACY_POLICY_VERSION=ci-privacy-v1' >> "$GITHUB_ENV"
          echo 'STORE_PRIVACY_POLICY_TITLE=CI Privacy Policy' >> "$GITHUB_ENV"
          echo 'STORE_PRIVACY_POLICY_URL=https://example.invalid/legal/privacy-policy' >> "$GITHUB_ENV"
          echo 'STORE_PHONE_AUTHORIZATION_VERSION=ci-phone-v1' >> "$GITHUB_ENV"
          echo 'STORE_PHONE_AUTHORIZATION_TITLE=CI Phone Authorization Notice' >> "$GITHUB_ENV"
          echo 'STORE_PHONE_AUTHORIZATION_URL=https://example.invalid/legal/phone-authorization' >> "$GITHUB_ENV"
          echo 'STORE_LEGAL_RATE_LIMIT_MAX=120' >> "$GITHUB_ENV"
          echo 'STORE_LEGAL_RATE_LIMIT_WINDOW_SECONDS=60' >> "$GITHUB_ENV"
          echo 'STORE_LOGIN_RATE_LIMIT_MAX=10' >> "$GITHUB_ENV"
          echo 'STORE_LOGIN_RATE_LIMIT_WINDOW_SECONDS=900' >> "$GITHUB_ENV"
          echo 'STORE_CUSTOMER_RATE_LIMIT_MAX=120' >> "$GITHUB_ENV"
          echo 'STORE_CUSTOMER_RATE_LIMIT_WINDOW_SECONDS=60' >> "$GITHUB_ENV"
          echo 'STORE_PAYMENT_PROVIDER=MOCK' >> "$GITHUB_ENV"
          echo "PAYMENT_MOCK_SIGNING_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo 'PAYMENT_PROVIDER_TIMEOUT_MS=5000' >> "$GITHUB_ENV"

      - name: Validate environment contract
        run: pnpm config:check

      - name: Lint source
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Lint OpenAPI
        run: pnpm contracts:lint

      - name: Check CH-028 contract invariants
        run: pnpm contracts:check

      - name: Check generated contract drift
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts
          test -z "$(git status --porcelain --untracked-files=all -- packages/contracts)"
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts
          test -z "$(git status --porcelain --untracked-files=all -- packages/contracts)"

      - name: Scan credentials and PII fixtures
        run: pnpm scan:sensitive

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Verify frozen database artifacts
        run: pnpm db:check-frozen

      - name: Replay and verify complete migration chain
        run: pnpm db:migrate:baseline

      - name: Test permission gates with fault injection
        run: pnpm db:test-permissions

      - name: Run B4 browser to Nest, PostgreSQL, Redis and MinIO vertical smoke
        env:
          B4_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b4:vertical

      - name: Run B5 browser to Nest, PostgreSQL, Redis and MinIO vertical smoke
        env:
          B5_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b5:vertical

      - name: Run B6 browser to Nest, PostgreSQL and MinIO vertical smoke
        env:
          B6_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b6:vertical

      - name: Run B7 browser to Nest, PostgreSQL and Redis Mock Provider vertical smoke
        env:
          B7_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b7:vertical

      - name: Run B8 browser to Nest, PostgreSQL, Redis and MinIO vertical smoke
        env:
          B8_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b8:vertical

      - name: Run B9 browser to Nest, PostgreSQL, Redis, MinIO and Worker vertical smoke
        env:
          B9_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b9:vertical

      - name: Run B10 browser to Nest, PostgreSQL, Redis, MinIO, Worker and Mock Provider vertical smoke
        env:
          B10_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b10:vertical

      - name: Run B11 browser to Nest, PostgreSQL, Redis, MinIO and Worker fulfillment vertical smoke
        env:
          B11_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b11:vertical

      - name: Run B12 browser to Nest, PostgreSQL, Redis, MinIO and Worker aftersales vertical smoke
        env:
          B12_VERTICAL_TEST_MODE: full
        run: pnpm e2e:b12:vertical

      - name: Test B1 persistence and worker concurrency
        env:
          B1_DATABASE_TEST_MODE: full
        run: pnpm db:test-b1

      - name: Test B2 administrator authentication transactions
        env:
          B2_DATABASE_TEST_MODE: full
        run: pnpm db:test-b2

      - name: Test B2 administrator authentication API with PostgreSQL
        env:
          B2_DATABASE_TEST_MODE: full
        run: pnpm db:test-b2-api

      - name: Test B3 file-asset transactions with PostgreSQL
        env:
          B3_FILE_DATABASE_TEST_MODE: full
        run: pnpm db:test-b3-files

      - name: Test B3 file API and worker with PostgreSQL, Redis and MinIO
        env:
          B3_FILE_API_TEST_MODE: full
          B3_FILE_WORKER_TEST_MODE: full
        run: pnpm db:test-b3-files-api

      - name: Test B3 storage boundaries with real MinIO
        env:
          B3_MINIO_TEST_MODE: full
        run: pnpm test:b3-files:minio

      - name: Test B3 master-data transactions with PostgreSQL
        env:
          B3_MASTER_DATA_DATABASE_TEST_MODE: full
        run: pnpm db:test-b3-master-data

      - name: Test B3 catalog API with PostgreSQL, Redis and MinIO
        env:
          B3_CATALOG_API_TEST_MODE: full
        run: pnpm db:test-b3-catalog-api

      - name: Test B4 Product and SKU catalog with PostgreSQL
        env:
          B4_PRODUCT_CATALOG_DATABASE_TEST_MODE: full
        run: pnpm db:test-b4-product-catalog

      - name: Test B5 Banner transactions with PostgreSQL
        env:
          B5_BANNER_DATABASE_TEST_MODE: full
        run: pnpm db:test-b5-banners

      - name: Test B5 Inventory transactions with PostgreSQL
        env:
          B5_INVENTORY_DATABASE_TEST_MODE: full
        run: pnpm db:test-b5-inventory

      - name: Test B6 Store catalog reads with PostgreSQL
        env:
          B6_STORE_CATALOG_DATABASE_TEST_MODE: full
        run: pnpm db:test-b6-store-catalog

      - name: Test B7 Store authentication, profile, attribution and privacy with PostgreSQL
        env:
          B7_STORE_AUTH_DATABASE_TEST_MODE: full
        run: pnpm db:test-b7-store-auth

      - name: Test B8 Store favorites, cart, address and account-deletion cleanup with PostgreSQL
        env:
          B8_STORE_SHOPPING_DATABASE_TEST_MODE: full
        run: pnpm db:test-b8-store-shopping

      - name: Test B9 checkout, order reservation, cancellation and timeout with PostgreSQL
        env:
          B9_STORE_ORDER_DATABASE_TEST_MODE: full
        run: pnpm db:test-b9-store-orders

      - name: Test B10 payment settlement, inventory and commission with PostgreSQL
        env:
          B10_STORE_PAYMENT_DATABASE_TEST_MODE: full
        run: pnpm db:test-b10-payments

      - name: Test B11 fulfillment commands and completion with PostgreSQL
        env:
          B11_FULFILLMENT_DATABASE_TEST_MODE: full
        run: pnpm db:test-b11-fulfillment

      - name: Test B12 aftersales, return inspection and ordinary refunds with PostgreSQL
        env:
          B12_STORE_AFTERSALE_DATABASE_TEST_MODE: full
        run: pnpm db:test-b12-aftersales

      - name: Test B13.1 Agent lifecycle and authentication with PostgreSQL and Redis
        env:
          B13_AGENT_AUTH_DATABASE_TEST_MODE: full
        run: pnpm db:test-b13-agent

      - name: Verify Prisma migration drift
        run: pnpm db:diff

      - name: Run tests
        run: pnpm test

      - name: Build all five applications
        run: pnpm build

      - name: Build MP-Weixin target
        run: pnpm build:miniapp

      - name: Run B0 vertical browser E2E
        run: pnpm exec playwright test --config playwright.config.ts b0-shells.spec.ts

      - name: Run B2 administrator-authentication browser E2E
        run: pnpm e2e:b2

      - name: Run B3 catalog browser E2E
        run: pnpm e2e:b3

      - name: Run B4 Product and SKU browser E2E
        run: pnpm e2e:b4

      - name: Run B5 Banner and Inventory browser E2E
        run: pnpm e2e:b5

      - name: Run B6 anonymous storefront browser E2E
        run: pnpm e2e:b6

      - name: Run B7 Store identity and privacy browser E2E
        run: pnpm e2e:b7

      - name: Run B8 authenticated shopping browser E2E
        run: pnpm e2e:b8

      - name: Run B9 checkout and order browser E2E
        run: pnpm e2e:b9

      - name: Run B10 payment and reconciliation browser E2E
        run: pnpm e2e:b10

      - name: Run B11 order fulfillment browser E2E
        run: pnpm e2e:b11

      - name: Run B12 aftersales, return inspection and ordinary refund browser E2E
        run: pnpm e2e:b12
