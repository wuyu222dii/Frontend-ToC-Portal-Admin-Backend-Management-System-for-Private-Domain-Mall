name: Supabase development migration

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase development project reference being migrated
        required: true
        type: string
      target_sha:
        description: Exact main commit SHA to migrate
        required: true
        type: string
      confirmation:
        description: Approve the controlled development database migration
        required: true
        type: choice
        options:
          - CANCEL
          - DEVELOPMENT_MIGRATION_APPROVED

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-development-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEVELOPMENT_MIGRATION_APPROVED'
    name: Protected development migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: supabase-development
    env:
      CI: "true"
      NODE_ENV: test
      PGSSLROOTCERT: /tmp/supabase-prod-ca.crt
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      SUPABASE_MIGRATION_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Verify the exact main commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$DISPATCH_SHA" = "$TARGET_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$TARGET_SHA"

      - name: Require successful CI for the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$TARGET_SHA" \
            -f per_page=100 \
            -f status=completed \
            | jq --arg sha "$TARGET_SHA" --exit-status '
                [.workflow_runs[] | select(
                  .head_sha == $sha
                  and .head_branch == "main"
                  and .event == "push"
                  and .status == "completed"
                  and .conclusion == "success"
                )] | length > 0
              '

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase production CA
        run: |
          curl --fail --silent --show-error --location \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output "$PGSSLROOTCERT"
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  $PGSSLROOTCERT" \
            | sha256sum --check --strict

      - name: Validate frozen database artifacts
        run: pnpm db:check-frozen

      - name: Validate Prisma schema
        env:
          DIRECT_URL: postgresql://mall_migrator:prisma-validate-only@127.0.0.1:5432/schema_validation
        run: pnpm prisma:validate

      - name: Deploy and post-verify the B10 migration chain
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: node scripts/db/deploy-development.mjs
