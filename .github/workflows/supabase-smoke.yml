name: Supabase development smoke

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase development project reference being checked
        required: true
        type: string
      confirmation:
        description: Confirm this is the Singapore development project with no real customer data
        required: true
        type: choice
        options:
          - CANCEL
          - DEVELOPMENT_SMOKE_APPROVED

permissions:
  contents: read

concurrency:
  group: supabase-development-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEVELOPMENT_SMOKE_APPROVED'
    name: Protected rollback-only smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: supabase-development
    env:
      CI: "true"
      NODE_ENV: test
      PGSSLROOTCERT: /tmp/supabase-prod-ca.crt
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase production CA
        run: |
          curl --fail --silent --show-error --location \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output "$PGSSLROOTCERT"
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  $PGSSLROOTCERT" \
            | sha256sum --check --strict

      - name: Validate Prisma schema
        env:
          DIRECT_URL: postgresql://mall_migrator:prisma-validate-only@127.0.0.1:5432/schema_validation
        run: pnpm prisma:validate

      - name: Run read-only Supabase checks
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: scripts/ci/supabase-smoke.sh

      - name: Run rollback-only B1 runtime smoke
        env:
          B1_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b1

      - name: Run rollback-only B2 administrator-authentication smoke
        env:
          B2_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b2

      - name: Run rollback-only B3 file-assets smoke
        env:
          B3_FILE_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b3-files

      - name: Run rollback-only B3 master-data smoke
        env:
          B3_MASTER_DATA_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b3-master-data

      - name: Run rollback-only B4 Product and SKU catalog smoke
        env:
          B4_PRODUCT_CATALOG_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b4-product-catalog

      - name: Run rollback-only B5 Banner smoke
        env:
          B5_BANNER_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b5-banners

      - name: Run rollback-only B5 Inventory smoke
        env:
          B5_INVENTORY_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b5-inventory

      - name: Run rollback-only B6 Store catalog smoke
        env:
          B6_STORE_CATALOG_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b6-store-catalog

      - name: Run rollback-only B7 Store authentication smoke
        env:
          B7_STORE_AUTH_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b7-store-auth
