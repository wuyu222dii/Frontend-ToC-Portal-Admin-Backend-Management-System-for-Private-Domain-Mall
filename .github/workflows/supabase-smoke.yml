name: Supabase development smoke

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase development project reference being checked
        required: true
        type: string
      target_sha:
        description: Exact main commit SHA being checked
        required: true
        type: string
      confirmation:
        description: Confirm this is the Singapore development project with no real customer data
        required: true
        type: choice
        options:
          - CANCEL
          - DEVELOPMENT_SMOKE_APPROVED

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-development-database
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEVELOPMENT_SMOKE_APPROVED'
    name: Protected rollback-only smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: supabase-development
    env:
      CI: "true"
      NODE_ENV: test
      PGSSLROOTCERT: /tmp/supabase-prod-ca.crt
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Verify the exact main commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$DISPATCH_SHA" = "$TARGET_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$TARGET_SHA"

      - name: Require successful CI for the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$TARGET_SHA" \
            -f per_page=100 \
            -f status=completed \
            | jq --arg sha "$TARGET_SHA" --exit-status '
                [.workflow_runs[] | select(
                  .head_sha == $sha
                  and .head_branch == "main"
                  and .event == "push"
                  and .status == "completed"
                  and .conclusion == "success"
                )] | length > 0
              '

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase production CA
        run: |
          curl --fail --silent --show-error --location \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output "$PGSSLROOTCERT"
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  $PGSSLROOTCERT" \
            | sha256sum --check --strict

      - name: Validate Prisma schema
        env:
          DIRECT_URL: postgresql://mall_migrator:prisma-validate-only@127.0.0.1:5432/schema_validation
        run: pnpm prisma:validate

      - name: Run read-only Supabase checks
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: scripts/ci/supabase-smoke.sh

      - name: Run rollback-only B1 runtime smoke
        env:
          B1_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b1

      - name: Run rollback-only B2 administrator-authentication smoke
        env:
          B2_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b2

      - name: Run rollback-only B3 file-assets smoke
        env:
          B3_FILE_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b3-files

      - name: Run rollback-only B3 master-data smoke
        env:
          B3_MASTER_DATA_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b3-master-data

      - name: Run rollback-only B4 Product and SKU catalog smoke
        env:
          B4_PRODUCT_CATALOG_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b4-product-catalog

      - name: Run rollback-only B5 Banner smoke
        env:
          B5_BANNER_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b5-banners

      - name: Run rollback-only B5 Inventory smoke
        env:
          B5_INVENTORY_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b5-inventory

      - name: Run rollback-only B6 Store catalog smoke
        env:
          B6_STORE_CATALOG_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b6-store-catalog

      - name: Run rollback-only B7.1-B7.5 Store authentication, profile, attribution and privacy smoke
        env:
          B7_STORE_AUTH_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b7-store-auth

      - name: Run rollback-only B8 favorites, cart, address and account-deletion cleanup smoke
        env:
          B8_STORE_SHOPPING_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b8-store-shopping

      - name: Run rollback-only B9 checkout, order reservation, cancellation and timeout smoke
        env:
          B9_STORE_ORDER_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b9-store-orders

      - name: Run rollback-only B10 intent, attempt, close, inventory, attribution, commission, refund and reconciliation smoke
        env:
          B10_STORE_PAYMENT_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b10-payments

      - name: Run rollback-only B11 fulfillment command and completion smoke
        env:
          B11_FULFILLMENT_DATABASE_TEST_MODE: rollback
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_URL }}
        run: pnpm db:test-b11-fulfillment
