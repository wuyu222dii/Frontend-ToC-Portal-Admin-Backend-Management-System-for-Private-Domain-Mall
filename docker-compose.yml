name: private-mall-dev

services:
  redis:
    image: redis:7.4.10-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5175,http://localhost:5175
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-mall-development}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set a non-root S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set a non-root S3_SECRET_KEY in .env}
    volumes:
      - ./scripts/storage/minio-public-read-policy.json:/tmp/minio-public-read-policy.json:ro
      - ./scripts/storage/minio-runtime-policy.json:/tmp/minio-runtime-policy.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        test "$$MINIO_ROOT_USER" != "$$S3_ACCESS_KEY"
        test "$$MINIO_ROOT_PASSWORD" != "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        if ! lifecycle_result="$$(mc ilm rule remove --all --force "local/$$S3_BUCKET" 2>&1)"; then
          case "$$lifecycle_result" in
            *"lifecycle configuration does not exist"*) ;;
            *) printf '%s\n' "$$lifecycle_result" >&2; exit 1 ;;
          esac
        fi
        mc anonymous set none "local/$$S3_BUCKET"
        public_policy="$$(cat /tmp/minio-public-read-policy.json)"
        printf '%s\n' "$${public_policy//__S3_BUCKET__/$$S3_BUCKET}" > /tmp/minio-public-read-policy.rendered.json
        mc anonymous set-json /tmp/minio-public-read-policy.rendered.json "local/$$S3_BUCKET"
        runtime_policy="$$(cat /tmp/minio-runtime-policy.json)"
        printf '%s\n' "$${runtime_policy//__S3_BUCKET__/$$S3_BUCKET}" > /tmp/minio-runtime-policy.rendered.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy create local "qingxu-runtime-$$S3_ACCESS_KEY" /tmp/minio-runtime-policy.rendered.json
        mc admin policy attach local "qingxu-runtime-$$S3_ACCESS_KEY" --user "$$S3_ACCESS_KEY"
    restart: "no"

volumes:
  redis_data:
  minio_data:
