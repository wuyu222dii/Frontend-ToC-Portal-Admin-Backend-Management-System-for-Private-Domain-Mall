          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /files/{file_id}/download-url:
    get:
      tags:
        - "Files"
      summary: "按角色和业务对象返回短时签名 URL"
      description: "仅 READY 且通过角色和业务归属校验的文件可下载。private/ 对象返回有效期 5 分钟的签名 URL；公开素材的稳定地址由 FileUploadCompleteResponse.public_url 提供。本 GET operation 不接受 Idempotency-Key、不创建幂等记录；响应必须 no-store/private，且不得持久化或记录签名 URL。存储桶默认私有，仅 public/* 允许匿名 GET，private/* 始终禁止匿名访问。PENDING 或 staging/ 满 24 小时仅进入清理候选，删除前必须再次确认没有 READY 引用。"
      operationId: "getFilesByFileIdDownloadUrl"
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: "file_id"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
            Pragma:
              "$ref": "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileDownloadUrlResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    preAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "PreAuth"
    candidateToken:
      type: "apiKey"
      in: "header"
      name: "X-Candidate-Token"
    wechatSignature:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Signature"
    wechatTimestamp:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Timestamp"
    wechatNonce:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Nonce"
    wechatSerial:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Serial"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        pattern: "^\\\"[1-9][0-9]*\\\"$"
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    PageSize:
      name: "page_size"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Timezone:
      name: "timezone"
      in: "query"
      schema:
        type: "string"
        enum:
          - "Asia/Shanghai"
        default: "Asia/Shanghai"
    WechatTimestamp:
      name: "Wechatpay-Timestamp"
      in: "header"
      required: true
      schema:
        type: "string"
    WechatNonce:
      name: "Wechatpay-Nonce"
      in: "header"
      required: true
      schema:
        type: "string"
    WechatSerial:
      name: "Wechatpay-Serial"
      in: "header"
      required: true
      schema:
        type: "string"
  headers:
    CacheControlNoStore:
      description: "响应含认证令牌、短时能力、签名 URL、敏感明文或一次性确认 token，不得缓存。"
      schema:
        const: "no-store, private"
    PragmaNoCache:
      description: "兼容旧客户端和中间代理的禁止缓存指令。"
      schema:
        const: "no-cache"
  responses:
    BadRequest:
      description: "参数或签名头格式错误"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "未登录、会话失效或 Provider 验签失败"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "RBAC、数据范围、MFA 或 reauth grant 不满足"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "资源不存在或当前主体无权查看"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    StateConflict:
      description: "状态、版本、幂等请求哈希或唯一约束冲突；CH-006 固定冲突码包括 SOFT_DELETED_KEY_RESERVED。"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    BusinessError:
      description: "库存、售后额度、金额分配或业务前置校验失败；CH-006 固定业务码包括 ACTIVE_PRODUCT_DEPENDENCY、FILE_CONTENT_MISMATCH。"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "访问、登录或 MFA 失败次数受限"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalError:
      description: "未预期错误；响应不暴露堆栈、SQL 或 Provider 原文"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "request_id"
      properties:
        code:
          type: "string"
        message:
          type: "string"
        details:
          type: "array"
          items:
            "$ref": "#/components/schemas/ErrorDetail"
        request_id:
          type: "string"
    ErrorDetail:
      type: "object"
      additionalProperties: false
      required:
        - "field"
        - "reason"
      properties:
        field:
          type:
            - "string"
            - "null"
        reason:
          type: "string"
        rejected_value:
          type:
            - "string"
            - "null"
    CommandResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "resource_type"
            - "resource_id"
            - "status"
            - "version"
            - "occurred_at"
          properties:
            resource_type:
              type: "string"
            resource_id:
              type: "string"
            status:
              type: "string"
            version:
              type: "integer"
              minimum: 1
            occurred_at:
              type: "string"
              format: "date-time"
        request_id:
          type: "string"
    PositiveMoney:
      type: "string"
      pattern: "^(?:0\\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]*\\.[0-9]{2})$"
    NonNegativeMoney:
      type: "string"
      pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
    SignedMoney:
      type: "string"
      pattern: "^-?(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
    RatePercentValue:
      type: "string"
      pattern: "^(?:100\\.0000|(?:0|[1-9][0-9]?)\\.[0-9]{4})$"
      examples:
        - "0.0000"
        - "12.5000"
        - "100.0000"
    PaginationView:
      type: "object"
      additionalProperties: false
      required: ["page", "page_size", "total"]
      properties:
        page:
          type: "integer"
          minimum: 1
        page_size:
          type: "integer"
          minimum: 1
          maximum: 100
        total:
          type: "integer"
          minimum: 0
    ConsentInput:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "document_version"
        - "accepted"
      properties:
        type:
          type: "string"
          enum:
            - "USER_AGREEMENT"
            - "PRIVACY_POLICY"
        document_version:
          type: "string"
          minLength: 1
        accepted:
          const: true
    WechatLoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "consents"
      properties:
        code:
          type: "string"
          minLength: 1
        candidate_token:
          type:
            - "string"
            - "null"
          minLength: 32
          writeOnly: true
        consents:
          type: "array"
          minItems: 2
          maxItems: 2
          items:
            "$ref": "#/components/schemas/ConsentInput"
    PasswordLoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "login_name"
        - "password"
      properties:
        login_name:
          type: "string"
          minLength: 1
        password:
          type: "string"
          format: "password"
          minLength: 8
    RefreshTokenRequest:
      type: "object"
      additionalProperties: false
      required:
        - "refresh_token"
      properties:
        refresh_token:
          type: "string"
          minLength: 20
    ChangePasswordRequest:
      type: "object"
      additionalProperties: false
      required:
        - "current_password"
        - "new_password"
      properties:
        current_password:
          type: "string"
          format: "password"
        new_password:
          type: "string"
          format: "password"
          minLength: 12
    AuthPreauthData:
      type: "object"
      additionalProperties: false
      required:
        - "pre_auth_token"
        - "mfa_required"
        - "assurance"
        - "next_action"
        - "expires_at"
      properties:
        pre_auth_token:
          type: "string"
          minLength: 20
        mfa_required:
          const: true
        assurance:
          const: "PASSWORD_ONLY"
        next_action:
          type: "string"
          enum:
            - "ENROLL_TOTP"
            - "VERIFY_TOTP"
        challenge_id:
          type:
            - "string"
            - "null"
        expires_at:
          type: "string"
          format: "date-time"
    AuthSessionData:
      type: "object"
      additionalProperties: false
      required:
        - "access_token"
        - "refresh_token"
        - "mfa_required"
        - "assurance"
        - "expires_at"
      properties:
        access_token:
          type: "string"
        refresh_token:
          type: "string"
        mfa_required:
          const: false
        assurance:
          type: "string"
          enum:
            - "WECHAT"
            - "PASSWORD"
            - "MFA"
        expires_at:
          type: "string"
          format: "date-time"
    RestrictedAgentSessionData:
      type: "object"
      additionalProperties: false
      required:
        - "access_token"
        - "must_change_password"
        - "next_action"
        - "allowed_actions"
        - "expires_at"
      properties:
        access_token:
          type: "string"
        must_change_password:
          const: true
        next_action:
          const: "CHANGE_PASSWORD"
        allowed_actions:
          type: "array"
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "CHANGE_TEMPORARY_PASSWORD"
              - "LOGOUT"
        expires_at:
          type: "string"
          format: "date-time"
    AdminLoginPreAuthResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          "$ref": "#/components/schemas/AuthPreauthData"
        request_id:
          type: "string"
    SessionAuthResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          "$ref": "#/components/schemas/AuthSessionData"
        request_id:
          type: "string"
    AgentLoginResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          oneOf:
            -
              "$ref": "#/components/schemas/AuthSessionData"
            -
              "$ref": "#/components/schemas/RestrictedAgentSessionData"
        request_id:
          type: "string"
    AttributionCandidateSummary:
      type: "object"
      additionalProperties: false
      required:
        - "candidate_id"
        - "agent_id"
        - "agent_name"
        - "expires_at"
        - "attribution_eligible"
      properties:
        candidate_id:
          type: "string"
        agent_id:
          type: "string"
        agent_name:
          type: "string"
        expires_at:
          type: "string"
          format: "date-time"
        attribution_eligible:
          type: "boolean"
    WechatAuthResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "session"
            - "confirmation_required"
            - "candidate"
          properties:
            session:
              "$ref": "#/components/schemas/AuthSessionData"
            confirmation_required:
              type: "boolean"
            candidate:
              oneOf:
                -
                  "$ref": "#/components/schemas/AttributionCandidateSummary"
                -
                  type: "null"
        request_id:
          type: "string"
    TotpEnrollRequest:
      type: "object"
      additionalProperties: false
      properties:
        label:
          type: "string"
          maxLength: 80
    TotpVerifyRequest:
      type: "object"
      additionalProperties: false
      required:
        - "challenge_id"
        - "totp_code"
      properties:
        challenge_id:
          type: "string"
        totp_code:
          type: "string"
          pattern: "^[0-9]{6}$"
    TotpCodeRequest:
      type: "object"
      additionalProperties: false
      required:
        - "totp_code"
      properties:
        totp_code:
          type: "string"
          pattern: "^[0-9]{6}$"
    MfaChallengeRequest:
      type: "object"
      additionalProperties: false
      required:
        - "purpose"
      properties:
        purpose:
          const: "REAUTH"
        target_id:
          type:
            - "string"
            - "null"
    MfaRecoveryRequest:
      type: "object"
      additionalProperties: false
      required:
        - "challenge_id"
        - "recovery_code"
      properties:
        challenge_id:
          type: "string"
        recovery_code:
          type: "string"
          minLength: 8
    TotpEnrollResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "factor_id"
            - "challenge_id"
            - "otpauth_uri"
            - "expires_at"
          properties:
            factor_id:
              type: "string"
            challenge_id:
              type: "string"
            otpauth_uri:
              type: "string"
              pattern: "^otpauth://totp/"
              description: "仅在本次 no-store 响应中展示一次，不进入日志、缓存或幂等响应体。"
            expires_at:
              type: "string"
              format: "date-time"
        request_id:
          type: "string"
    TotpEnrollVerifyResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "factor_id"
            - "recovery_codes"
            - "session"
          properties:
            factor_id:
              type: "string"
            recovery_codes:
              type: "array"
              minItems: 8
              items:
                type: "string"
              description: "仅在本次 no-store 响应中展示一次，不进入日志、缓存或幂等响应体。"
            session:
              "$ref": "#/components/schemas/AdminAuthSessionData"
        request_id:
          type: "string"
    MfaChallengeResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "challenge_id"
            - "purpose"
            - "expires_at"
          properties:
            challenge_id:
              type: "string"
            purpose:
              const: "REAUTH"
            expires_at:
              type: "string"
              format: "date-time"
        request_id:
          type: "string"
    MfaVerifiedData:
      type: "object"
      additionalProperties: false
      required:
        - "challenge_id"
        - "purpose"
        - "verified_at"
      properties:
        challenge_id:
          type: "string"
        purpose:
          const: "REAUTH"
        verified_at:
          type: "string"
          format: "date-time"
    RotateRecoveryCodesResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "recovery_codes"
            - "rotated_at"
          properties:
            recovery_codes:
              type: "array"
              minItems: 8
              items:
                type: "string"
              description: "仅在本次 no-store 响应中展示一次，不进入日志、缓存或幂等响应体。"
            rotated_at:
              type: "string"
              format: "date-time"
        request_id:
          type: "string"
    PayoutReauthRequest:
      type: "object"
      additionalProperties: false
      required:
        - "action"
        - "withdrawal_id"
        - "totp_code"
      properties:
        action:
          const: "PAYOUT_ACCOUNT_REVEAL"
        withdrawal_id:
          type: "string"
        totp_code:
          type: "string"
          pattern: "^[0-9]{6}$"
          writeOnly: true
    ReauthResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "reauth_grant"
            - "expires_at"
            - "single_use"
            - "withdrawal_id"
          properties:
            reauth_grant:
              type: "string"
            expires_at:
              type: "string"
              format: "date-time"
            single_use:
              const: true
            withdrawal_id:
              type: "string"
        request_id:
          type: "string"
    PhoneAuthorizationRequest:
      type: "object"
      additionalProperties: false
      required:
        - "provider"
        - "provider_credential"
        - "consent_version"
      properties:
        provider:
          type: "string"
          enum:
            - "WECHAT"
            - "MOCK"
        provider_credential:
          type: "string"
          minLength: 1
        consent_version:
          type: "string"
          minLength: 1
    ProfileUpdateRequest:
      type: "object"
      additionalProperties: false
      properties:
        nickname:
          type:
            - "string"
            - "null"
          maxLength: 80
        avatar_url:
          type:
            - "string"
            - "null"
          format: "uri"
        city:
          type:
            - "string"
            - "null"
          maxLength: 120
      minProperties: 1
    AttributionCandidateRequest:
      type: "object"
      additionalProperties: false
      required:
        - "invite_code"
        - "promotion_asset_id"
        - "target_type"
      properties:
        invite_code:
          type: "string"
        promotion_asset_id:
          type: "string"
        target_type:
          type: "string"
          enum:
            - "STOREFRONT"
            - "PRODUCT"
        target_id:
          type:
            - "string"
            - "null"
    CartQuantityRequest:
      type: "object"
      additionalProperties: false
      required:
        - "quantity"
      properties:
        quantity:
          type: "integer"
          minimum: 1
          maximum: 99
    CartMergeRequest:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/OrderLineInput"
    AddressWriteRequest:
      type: "object"
      additionalProperties: false
      required:
        - "recipient_name"
        - "phone"
        - "province"
        - "city"
        - "district"
        - "detail"
        - "is_default"
      properties:
        recipient_name:
          type: "string"
          minLength: 1
          maxLength: 80
        phone:
          type: "string"
          pattern: "^[0-9+ -]{6,30}$"
          writeOnly: true
        province:
          type: "string"
          maxLength: 80
        city:
          type: "string"
          maxLength: 80
        district:
          type: "string"
          maxLength: 80
        detail:
          type: "string"
          minLength: 1
          maxLength: 300
          writeOnly: true
        is_default:
          type: "boolean"
    OrderLineInput:
      type: "object"
      additionalProperties: false
      required:
        - "sku_id"
        - "quantity"
      properties:
        sku_id:
          type: "string"
        quantity:
          type: "integer"
          minimum: 1
          maximum: 99
    CreateOrderRequest:
      type: "object"
      additionalProperties: false
      required:
        - "source"
        - "address_id"
        - "items"
      properties:
        source:
          type: "string"
          enum:
            - "CART"
            - "BUY_NOW"
        address_id:
          type: "string"
        items:
