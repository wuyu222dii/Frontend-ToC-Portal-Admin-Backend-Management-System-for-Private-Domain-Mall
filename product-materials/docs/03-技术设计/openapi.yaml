  /agent/orders:
    get:
      tags:
        - "Agent"
      summary: "支付时最终冻结为本代理的订单"
      description: "服务端先限定 payment_status=PAID 且支付快照 final_agent_id=当前认证代理，再应用全部查询条件，最后计算 total 并分页；禁止分页后在应用层剔除越权或售后不匹配记录。"
      operationId: "getAgentOrders"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          name: "customer_id"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "仅筛选当前代理本人归属期内并在支付时冻结归因为本代理的客户订单；越权 ID 返回 404。"
        -
          name: "order_no"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "订单号"
        -
          name: "order_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "PENDING_SHIPMENT"
              - "SHIPPING"
              - "COMPLETED"
              - "CLOSED"
          description: "订单轴"
        -
          name: "refund_progress_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "NONE"
              - "PARTIAL"
              - "FULL"
          description: "成功退款进度轴"
        -
          name: "refund_processing_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "IDLE"
              - "REFUNDING"
              - "FAILED"
          description: "退款处理轴"
        -
          name: "fulfillment_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "NOT_STARTED"
              - "READY_TO_SHIP"
              - "SHIPPED"
              - "IN_TRANSIT"
              - "DELIVERED"
              - "CANCELLED"
          description: "履约轴"
        -
          name: "has_aftersale"
          in: "query"
          required: false
          schema:
            type: "boolean"
          description: "true 仅返回存在任一售后记录的订单，false 仅返回从未创建售后的订单；在 total 计算和分页前过滤。"
        -
          name: "date_from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Asia/Shanghai 自然日；date_to 包含当日"
        -
          name: "date_to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Asia/Shanghai 自然日；date_to 包含当日"
        -
          name: "min_amount"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
          description: "两位非负 decimal string"
        -
          name: "max_amount"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
          description: "两位非负 decimal string"
        -
          name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "CREATED_DESC"
              - "PAID_DESC"
              - "AMOUNT_DESC"
          description: "默认 CREATED_DESC；相同值按 order_id DESC"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgentOrderListResponse"
        400:
