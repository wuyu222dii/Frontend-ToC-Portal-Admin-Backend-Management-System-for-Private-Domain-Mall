            status:
              type: "string"
              enum: ["PENDING_REVIEW", "REJECTED", "REFUNDING", "WAITING_RETURN", "WAITING_RECEIPT", "RETURN_EXCEPTION", "REFUNDING_AFTER_RETURN", "REJECTED_AFTER_RETURN", "REFUND_FAILED", "COMPLETED", "CANCELLED"]
            items:
              type: "array"
              minItems: 1
              items:
                type: "object"
                additionalProperties: false
                required: ["aftersale_item_id", "order_item_id", "quantity", "allocated_amount", "reserved_quantity", "reserved_amount"]
                properties:
