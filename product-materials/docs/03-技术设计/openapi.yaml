    get:
      tags:
        - "Store"
      summary: "本人订单列表和状态筛选"
      operationId: "getStoreOrders"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          name: "display_group"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: ["ALL", "PENDING_PAYMENT", "PENDING_SHIPMENT", "SHIPPING", "COMPLETED", "REFUND_AFTERSALE"]
            default: "ALL"
          description: "小程序订单 Tab；服务端映射多状态轴，客户端不得自行拼接。"
        -
          name: "order_no"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "订单号"
        -
          name: "order_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "PENDING_PAYMENT"
              - "PENDING_SHIPMENT"
              - "SHIPPING"
              - "COMPLETED"
              - "CLOSED"
          description: "订单轴"
        -
          name: "payment_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "UNPAID"
              - "PROCESSING"
              - "PAID"
          description: "支付轴"
        -
          name: "refund_progress_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "NONE"
              - "PARTIAL"
              - "FULL"
          description: "成功退款进度轴"
        -
          name: "refund_processing_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "IDLE"
              - "REFUNDING"
              - "FAILED"
          description: "退款处理轴"
        -
          name: "fulfillment_status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "NOT_STARTED"
              - "READY_TO_SHIP"
              - "SHIPPED"
              - "IN_TRANSIT"
              - "DELIVERED"
              - "CANCELLED"
          description: "履约轴"
        -
          name: "date_from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Asia/Shanghai 自然日；date_to 包含当日"
        -
          name: "date_to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Asia/Shanghai 自然日；date_to 包含当日"
        -
          name: "min_amount"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
          description: "两位非负 decimal string"
        -
          name: "max_amount"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
          description: "两位非负 decimal string"
        -
          name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "CREATED_DESC"
              - "PAID_DESC"
              - "AMOUNT_DESC"
          description: "默认 CREATED_DESC；相同值按 order_id DESC"
