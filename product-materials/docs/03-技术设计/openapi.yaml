      type: "object"
      additionalProperties: false
      required: ["invite_code_id", "code_masked", "status", "expires_at", "version"]
      properties:
        invite_code_id:
          type: "string"
        code_masked:
          type: "string"
          description: "详情仅展示掩码；完整邀请码只在创建或轮换的 no-store 响应中返回一次。"
        status:
          type: "string"
          enum: ["ACTIVE", "DISABLED", "ROTATED", "EXPIRED"]
        expires_at:
          type: ["string", "null"]
          format: "date-time"
        version:
          type: "integer"
          minimum: 1
    IssuedInviteCodeView:
      type: "object"
      additionalProperties: false
      required: ["invite_code_id", "code", "status", "expires_at", "version"]
      properties:
        invite_code_id:
          type: "string"
        code:
          type: "string"
          minLength: 4
          description: "仅本次 no-store 响应完整展示；不得写入日志或幂等响应缓存。"
        status:
          const: "ACTIVE"
        expires_at:
          type: ["string", "null"]
          format: "date-time"
        version:
          type: "integer"
          minimum: 1
    AdminAgentDetailResponse:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "data", "request_id"]
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required: ["agent", "invite_code", "operating_summary", "wallet_summary", "withdrawal_summary"]
          properties:
            agent:
              "$ref": "#/components/schemas/AgentView"
            invite_code:
              oneOf:
                -
                  "$ref": "#/components/schemas/InviteCodeView"
                -
                  type: "null"
            operating_summary:
              type: "object"
              additionalProperties: false
              required: ["net_sales_amount", "paid_order_count", "active_customer_count", "new_binding_count"]
              properties:
                net_sales_amount:
                  "$ref": "#/components/schemas/SignedMoney"
                paid_order_count:
                  type: "integer"
                  minimum: 0
                active_customer_count:
                  type: "integer"
                  minimum: 0
                new_binding_count:
                  type: "integer"
                  minimum: 0
            wallet_summary:
              type: "object"
              additionalProperties: false
              required: ["expected_commission", "available_balance", "frozen_balance", "negative_balance", "version"]
              properties:
                expected_commission:
                  "$ref": "#/components/schemas/NonNegativeMoney"
                available_balance:
                  "$ref": "#/components/schemas/SignedMoney"
                frozen_balance:
                  "$ref": "#/components/schemas/NonNegativeMoney"
                negative_balance:
                  "$ref": "#/components/schemas/NonNegativeMoney"
                version:
                  type: "integer"
                  minimum: 1
            withdrawal_summary:
              type: "object"
              additionalProperties: false
              required: ["pending_count", "approved_count", "paid_count", "total_paid_amount", "latest_withdrawal_at"]
              properties:
                pending_count:
                  type: "integer"
                  minimum: 0
                approved_count:
                  type: "integer"
                  minimum: 0
                paid_count:
                  type: "integer"
                  minimum: 0
                total_paid_amount:
                  "$ref": "#/components/schemas/NonNegativeMoney"
                latest_withdrawal_at:
                  type: ["string", "null"]
                  format: "date-time"
        request_id:
          type: "string"
    InviteCodeRotateResponse:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "data", "request_id"]
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required: ["agent_id", "new_invite_code", "old_code_invalidated"]
          properties:
            agent_id:
              type: "string"
            new_invite_code:
              "$ref": "#/components/schemas/IssuedInviteCodeView"
            old_code_invalidated:
              type: "object"
              additionalProperties: false
              required: ["invite_code_id", "code_masked", "invalidated_at", "existing_bindings_unchanged"]
              properties:
                invite_code_id:
                  type: "string"
                code_masked:
                  type: "string"
                invalidated_at:
                  type: "string"
                  format: "date-time"
                existing_bindings_unchanged:
                  const: true
        request_id:
          type: "string"
    AdminPayoutAccountSnapshotView:
      type: "object"
      additionalProperties: false
      required: ["account_holder_masked", "bank_name", "account_number_masked", "account_no_last4", "snapshot_at"]
      properties:
        account_holder_masked:
          type: "string"
        bank_name:
          type: "string"
        account_number_masked:
          type: "string"
        account_no_last4:
          type: "string"
          pattern: "^[0-9]{4}$"
        snapshot_at:
          type: "string"
          format: "date-time"
      description: "申请时冻结银行卡快照，仅掩码；完整账号仍只通过 60 秒单次授权接口读取。"
    AdminWithdrawalView:
      type: "object"
      additionalProperties: false
      required: ["withdrawal_id", "withdrawal_no", "agent_id", "agent_no", "agent_name", "status", "amount", "request_balance_snapshot", "payout_account_snapshot", "review_reason", "created_at", "reviewed_at", "paid_at", "proof_file_ids", "version"]
      properties:
        withdrawal_id:
          type: "string"
        withdrawal_no:
          type: "string"
        agent_id:
          type: "string"
        agent_no:
          type: "string"
        agent_name:
          type: "string"
        status:
          type: "string"
          enum: ["PENDING", "APPROVED", "REJECTED", "PAID"]
        amount:
          "$ref": "#/components/schemas/PositiveMoney"
        request_balance_snapshot:
          type: "object"
          additionalProperties: false
          required: ["available_before", "available_after", "frozen_before", "frozen_after", "captured_at"]
          properties:
            available_before:
              "$ref": "#/components/schemas/SignedMoney"
            available_after:
              "$ref": "#/components/schemas/SignedMoney"
            frozen_before:
              "$ref": "#/components/schemas/NonNegativeMoney"
            frozen_after:
              "$ref": "#/components/schemas/NonNegativeMoney"
            captured_at:
              type: "string"
              format: "date-time"
        payout_account_snapshot:
          "$ref": "#/components/schemas/AdminPayoutAccountSnapshotView"
        review_reason:
          type: ["string", "null"]
        created_at:
          type: "string"
          format: "date-time"
        reviewed_at:
          type: ["string", "null"]
          format: "date-time"
        paid_at:
          type: ["string", "null"]
          format: "date-time"
        proof_file_ids:
          type: "array"
          items:
            type: "string"
        version:
          type: "integer"
          minimum: 1
    AdminWithdrawalResponse:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "data", "request_id"]
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          "$ref": "#/components/schemas/AdminWithdrawalView"
        request_id:
          type: "string"
    AdminWithdrawalListResponse:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "data", "request_id"]
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required: ["items", "pagination"]
          properties:
            items:
              type: "array"
              items:
                "$ref": "#/components/schemas/AdminWithdrawalView"
            pagination:
              type: "object"
              additionalProperties: false
              required: ["page", "page_size", "total"]
              properties:
                page:
                  type: "integer"
                  minimum: 1
                page_size:
                  type: "integer"
                  minimum: 1
                  maximum: 100
                total:
                  type: "integer"
                  minimum: 0
        request_id:
          type: "string"
    AuditChangeSummaryItem:
      type: "object"
      additionalProperties: false
      required: ["field", "display_value", "sensitive"]
      properties:
        field:
          type: "string"
        display_value:
          type: "string"
          description: "sensitive=true 时固定为‘发生变化’，不得返回 before_json/after_json 中的敏感原值。"
        sensitive:
          type: "boolean"
    AdminFulfillmentAddressResponse:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "data", "request_id"]
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required: ["order_id", "order_no", "snapshot_id", "recipient_name", "phone", "province", "city", "district", "detail", "snapshot_at", "purpose", "access_expires_at"]
          properties:
            order_id:
              type: "string"
            order_no:
              type: "string"
            snapshot_id:
              type: "string"
            recipient_name:
              type: "string"
            phone:
              type: "string"
            province:
              type: "string"
            city:
              type: "string"
            district:
              type: "string"
            detail:
              type: "string"
            snapshot_at:
              type: "string"
              format: "date-time"
            purpose:
              const: "ORDER_FULFILLMENT"
            access_expires_at:
              type: "string"
              format: "date-time"
