openapi: "3.1.0"
info:
  title: "洗化产品私域商城 API"
  version: "2.4.5-ch016"
  description: "CH-016 单一线协议，继承 CH-006、CH-008、CH-010、CH-012 与 CH-014，并闭合 B7 消费者身份、会话、手机号、归属和账号删除语义。所有路径相对 /api/v1；文本目录与本文件 operation 集合必须完全一致。"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
servers:
  -
    url: "/api/v1"
tags:
  -
    name: "Store"
    description: "微信小程序消费者接口"
  -
    name: "Agent"
    description: "一级代理工作台接口"
  -
    name: "Admin"
    description: "总部超级管理员接口"
  -
    name: "Callbacks"
    description: "微信支付与退款回调收件箱"
  -
    name: "Files"
    description: "受控文件上传与完成接口"
paths:
  /store/legal-documents:
    get:
      tags:
        - "Store"
      summary: "读取当前用户协议、隐私政策与手机号授权文档快照"
      description: "匿名读取当前生效的用户协议、隐私政策和手机号授权文档。前两份文档版本是登录 consents 的唯一匹配基线，手机号授权单独使用第三份文档版本；响应禁止缓存。此接口使用独立于匿名目录的 Redis 固定窗口 key namespace，仅保存来源 IP 的 HMAC，每个来源每 60 秒最多 120 次；Redis 不可用时 fail closed。"
      operationId: "getStoreLegalDocuments"
      security: []
      parameters: []
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LegalDocumentsResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        429:
          "$ref": "#/components/responses/StoreLegalRateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/auth/wechat/login:
    post:
      tags:
        - "Store"
      summary: "使用微信 code 登录；设计阶段可由 Mock Provider 替代"
      description: "服务端按环境配置选择微信或 Mock 身份 Provider，客户端不得选择 Provider；Mock 仅允许 test/development。B7 固定一个消费者微信 AppID，以 (AppID, openid) 语义识别主体；现 account.wechat_open_id 仅在单 AppID 基线内唯一。wechat_union_id 仅为可空元数据，不得作为登录键或触发账号自动合并；多 AppID 必须另立变更并执行数据库迁移。code、candidate_token 和会话令牌不得进入日志、审计或幂等响应缓存。此 operation 使用 HASH_ONLY 幂等策略：仅保存请求哈希与完成事实，不回放 access_token、refresh_token 或候选 token。登录按来源 IP HMAC 使用独立 Redis 固定窗口，每 15 分钟最多 10 次，Redis 不可用时 fail closed；超限返回准确 Retry-After。登录固定签发 aud=qingxu-store、role=CUSTOMER、assurance=WECHAT 的会话，Provider 不是 token claim，绝不接受或签发 B2 SUPER_ADMIN/MFA 权限。consents 必须与 /store/legal-documents 当前版本逐项匹配，否则返回 409 CONSENT_VERSION_MISMATCH；有效 candidate_token 仅可迁移一次并原子清除 token hash。"
      operationId: "postStoreAuthWechatLogin"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WechatLoginRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WechatAuthResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreLoginConflict"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreLoginRateLimited"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/auth/refresh:
    post:
      tags:
        - "Store"
      summary: "刷新会话并轮换 refresh token"
      description: "仅接受 aud=qingxu-store、role=CUSTOMER、assurance=WECHAT 的 refresh token；按 session_family 串行轮换，旧 token 重放撤销整个 family。使用 HASH_ONLY 幂等策略，不缓存或重放 access_token、refresh_token。"
      operationId: "postStoreAuthRefresh"
      x-ch016-lost-response-retry: "同一 Idempotency-Key 在成功响应丢失后重试固定返回 409 且不回放 token；服务端先识别该已完成幂等事实，不将其误判为恶意旧 refresh token 重放而撤销 family。使用新幂等键重放已轮换 token 仍按安全规则撤销 family。"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StoreRefreshTokenRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreSessionResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/auth/logout:
    post:
      tags:
        - "Store"
      summary: "注销当前会话"
      description: "仅接受 aud=qingxu-store、role=CUSTOMER、assurance=WECHAT 的会话；使用 HASH_ONLY 幂等策略撤销当前 session，不缓存响应或回放 bearer/session 凭据，绝不接受 B2 SUPER_ADMIN/MFA 会话。"
      operationId: "postStoreAuthLogout"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/profile:
    get:
      tags:
        - "Store"
      summary: "当前消费者资料，账户手机号默认掩码"
      description: "仅接受 aud=qingxu-store、role=CUSTOMER、assurance=WECHAT 的会话；响应只投影当前 CUSTOMER 的最小资料和账户手机号掩码，不读取收货地址手机号。"
      operationId: "getStoreProfile"
      security:
        -
          bearerAuth: []
      parameters: []
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
    patch:
      tags:
        - "Store"
      summary: "更新昵称、头像等非敏感资料"
      description: "仅更新当前 CUSTOMER 的非敏感资料并校验 If-Match 对应 profile.version。使用 HASH_ONLY 幂等策略，不缓存资料响应；不得写入账户手机号或收货地址。"
      operationId: "patchStoreProfile"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileUpdateRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/profile/phone-authorizations:
    post:
      tags:
        - "Store"
      summary: "使用微信手机号凭证完成自愿授权；要求 Idempotency-Key 与 If-Match"
      description: "客户端只提交一次性 provider_credential 与已接受的 PHONE_AUTHORIZATION 协议版本，不能选择 Provider；服务端按环境选择微信 Provider，Mock 仅允许 test/development。协议版本必须匹配服务端当前手机号授权文档，否则返回 409 CONSENT_VERSION_MISMATCH。If-Match 必须对应 profile.version，版本冲突返回 409 且不自动覆盖。使用 HASH_ONLY 幂等策略，不缓存手机号凭证或资料响应；不得读取或写入收货地址手机号。"
      operationId: "postStoreProfilePhoneAuthorizations"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PhoneAuthorizationRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StorePhoneAuthorizationConflict"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/profile/phone:
    delete:
      tags:
        - "Store"
      summary: "撤回账户手机号使用授权；不修改历史订单快照"
      description: "撤回当前 CUSTOMER 的账户手机号授权，不读取或改写收货地址及历史订单快照。If-Match 必须对应 profile.version，版本冲突返回 409 且不自动覆盖。使用 HASH_ONLY 幂等策略，不缓存资料响应。"
      operationId: "deleteStoreProfilePhone"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          "$ref": "#/components/parameters/IfMatch"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/privacy/deletion-requests:
    post:
      tags:
        - "Store"
      summary: "确认账号删除并同步完成去标识化"
      description: "仅接受 5 分钟内未消费且绑定当前 actor、session、请求体与 account.version 的 preview_token，并要求 If-Match 与 preview 返回的 account_version 一致。使用 HASH_ONLY 幂等策略，不缓存或重放一次性完成响应。事务内重新检查阻断项，失败返回 422 ACCOUNT_DELETION_BLOCKED 且不消费 preview；通过后原子消费 preview、完成删除请求、撤销全部会话及 refresh hash、结束绑定和候选、清除微信主体与资料，并按冻结隐私规则删除或去标识化非交易数据。成功固定返回 COMPLETED，响应后当前及其他会话均不可再使用。"
      operationId: "postStorePrivacyDeletionRequests"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeletionConfirmRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeletionRequestResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreAccountDeletionBlocked"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/privacy/deletion-requests/preview:
    post:
      tags:
        - "Store"
      summary: "预览账号删除资格与不可逆影响"
      description: "只读取当前 CUSTOMER 的阻断事实与删除影响；eligible=false 时返回 blockers 且不签发 token，仍为 200。eligible=true 时签发有效期固定 5 分钟的 preview_token 和 confirmation_hash，并绑定 actor、session、acknowledged 请求体与 account.version；preview_token 数据库仅保存用途隔离的 HMAC。使用 HASH_ONLY，不缓存或重放 preview_token。"
      operationId: "postStorePrivacyDeletionRequestsPreview"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeletionPreviewRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/StoreCacheControlNoStoreRequired"
            Pragma:
              "$ref": "#/components/headers/StorePragmaNoCacheRequired"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeletionPreviewResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/attribution/candidates:
    post:
      tags:
        - "Store"
      summary: "打开代理推广链接时校验并保存 30 分钟候选"
      description: "客户端只提交 invite_code 与 promotion_asset_id；服务端从同一 promotion_asset 解析并校验唯一公开目标，不接受客户端 target_type/target_id。候选固定 30 分钟，游客 candidate_token 使用 32..512 字符高熵值、数据库只存 domain-separated HMAC 且仅首次签发；candidate token、幂等请求和 IP 限流使用互不相同的 scope/domain，禁止跨用途关联。匿名新请求仅在携带有效旧 X-Candidate-Token 时替换该 token 定位的候选；未携带旧 token 时旧候选按 TTL 自然过期，无效链接不得覆盖。已绑定 CUSTOMER 不创建候选。此 mutation 使用 HASH_ONLY，不缓存或重放 token。"
      operationId: "postStoreAttributionCandidates"
      x-ch016-result-invariant: "只允许三个互斥分支：有效候选、已有绑定，或不可归因但仍可公开访问的 fallback。"
      security:
        -
          bearerAuth: []
        -
          candidateToken: []
        - {}
      x-ch016-anonymous-replacement: "匿名新请求只能通过可选 X-Candidate-Token 定位并使旧候选失效；未提交旧 token 时无法关联另一匿名候选，旧候选仅按 TTL 自然过期。"
      x-ch016-credential-precedence: "同时携带 Authorization 与 X-Candidate-Token 返回 400 INVALID_ARGUMENT。只要携带 Authorization，就只校验 aud=qingxu-store、role=CUSTOMER、assurance=WECHAT 的 bearer，失败返回 401 且不得尝试 candidate token 或匿名分支；否则只要携带 X-Candidate-Token，就必须校验候选凭据，失效或过期返回 401 且不得降级匿名；仅两种凭据均未携带时使用匿名分支。"
      x-ch016-candidate-token-result: "成功返回有效 candidate 分支时，无凭据匿名请求和 candidateToken 请求必须签发新的非空 32..512 字符 candidate_token；bearer 请求必须返回 candidate_token=null。已有绑定与 public fallback 分支始终返回 null。"
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttributionCandidateRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              description: "游客 candidate_token 仅本次返回，不得缓存"
              required: true
              schema:
                const: "no-store, private"
            Pragma:
              required: true
              schema:
                const: "no-cache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttributionCandidateCreateResponse"
        400:
          "$ref": "#/components/responses/StoreSensitiveError"
        401:
          "$ref": "#/components/responses/StoreSensitiveError"
        403:
          "$ref": "#/components/responses/StoreSensitiveError"
        404:
          "$ref": "#/components/responses/StoreSensitiveError"
        409:
          "$ref": "#/components/responses/StoreSensitiveError"
        422:
          "$ref": "#/components/responses/StoreSensitiveError"
        429:
          "$ref": "#/components/responses/StoreSensitiveError"
        500:
          "$ref": "#/components/responses/StoreSensitiveError"
  /store/attribution/candidate:
    get:
      tags:
        - "Store"
      summary: "查询当前有效候选和剩余秒数"
      description: "游客使用创建响应签发的 X-Candidate-Token，CUSTOMER 使用 aud=qingxu-store 会话；只返回当前仍有效候选及剩余秒数，不回传或消费 candidate_token。双凭据或无效凭据按固定优先级 fail closed，不得降级到另一主体。"
      operationId: "getStoreAttributionCandidate"
      security:
        -
          bearerAuth: []
        -
          candidateToken: []
