openapi: "3.1.0"
info:
  title: "洗化产品私域商城 API"
  version: "2.4.1-ch006"
  description: "CH-006 单一线协议，含 CH-008 下载签名幂等语义勘误。所有路径相对 /api/v1；文本目录与本文件 operation 集合必须完全一致。"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
servers:
  -
    url: "/api/v1"
tags:
  -
    name: "Store"
    description: "微信小程序消费者接口"
  -
    name: "Agent"
    description: "一级代理工作台接口"
  -
    name: "Admin"
    description: "总部超级管理员接口"
  -
    name: "Callbacks"
    description: "微信支付与退款回调收件箱"
  -
    name: "Files"
    description: "受控文件上传与完成接口"
paths:
  /store/auth/wechat/login:
    post:
      tags:
        - "Store"
      summary: "使用微信 code 登录；设计阶段可由 Mock Provider 替代"
      operationId: "postStoreAuthWechatLogin"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WechatLoginRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
            Pragma:
              "$ref": "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WechatAuthResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/auth/refresh:
    post:
      tags:
        - "Store"
      summary: "刷新会话并轮换 refresh token"
      operationId: "postStoreAuthRefresh"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
            Pragma:
              "$ref": "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionAuthResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/auth/logout:
    post:
      tags:
        - "Store"
      summary: "注销当前会话"
      operationId: "postStoreAuthLogout"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/profile:
    get:
      tags:
        - "Store"
      summary: "当前消费者资料，账户手机号默认掩码"
      operationId: "getStoreProfile"
      security:
        -
          bearerAuth: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
    patch:
      tags:
        - "Store"
      summary: "更新昵称、头像等非敏感资料"
      operationId: "patchStoreProfile"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileUpdateRequest"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/profile/phone-authorizations:
    post:
      tags:
        - "Store"
      summary: "使用微信手机号凭证完成自愿授权；要求 Idempotency-Key"
      operationId: "postStoreProfilePhoneAuthorizations"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PhoneAuthorizationRequest"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/profile/phone:
    delete:
      tags:
        - "Store"
      summary: "撤回账户手机号使用授权；不修改历史订单快照"
      operationId: "deleteStoreProfilePhone"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/privacy/deletion-requests:
    post:
      tags:
        - "Store"
      summary: "申请账号删除和去标识化"
      operationId: "postStorePrivacyDeletionRequests"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeletionRequestResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/privacy/deletion-requests/current:
    get:
      tags:
        - "Store"
      summary: "查询当前删除申请状态"
      operationId: "getStorePrivacyDeletionRequestsCurrent"
      security:
        -
          bearerAuth: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeletionRequestResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/attribution/candidates:
    post:
      tags:
        - "Store"
      summary: "打开代理推广链接时校验并保存 30 分钟候选"
      operationId: "postStoreAttributionCandidates"
      security:
        -
          bearerAuth: []
        - {}
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttributionCandidateRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              description: "游客 candidate_token 仅本次返回，不得缓存"
              schema:
                const: "no-store, private"
            Pragma:
              schema:
                const: "no-cache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttributionCandidateCreateResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/attribution/candidate:
    get:
      tags:
        - "Store"
      summary: "查询当前有效候选和剩余秒数"
      operationId: "getStoreAttributionCandidate"
      security:
        -
          bearerAuth: []
        -
          candidateToken: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttributionCandidateQueryResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/attribution/candidate/confirm:
    post:
      tags:
        - "Store"
      summary: "明确确认并建立长期绑定"
      operationId: "postStoreAttributionCandidateConfirm"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttributionBindingResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/attribution/candidate/reject:
    post:
      tags:
        - "Store"
      summary: "拒绝并清空候选"
      operationId: "postStoreAttributionCandidateReject"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttributionCandidateRejectResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/service-agent:
    get:
      tags:
        - "Store"
      summary: "只读查看当前服务代理"
      operationId: "getStoreServiceAgent"
      security:
        -
          bearerAuth: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceAgentResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/home:
    get:
      tags:
        - "Store"
      summary: "Banner、分类、热销、新品聚合"
      operationId: "getStoreHome"
      security: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HomeResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/categories:
    get:
      tags:
        - "Store"
      summary: "已启用一级分类"
      operationId: "getStoreCategories"
      security: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreCategoryListResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/brands:
    get:
      tags:
        - "Store"
      summary: "已启用品牌"
      operationId: "getStoreBrands"
      security: []
      parameters: []
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreBrandListResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/products:
    get:
      tags:
        - "Store"
      summary: "关键词、品牌、分类、排序和分页"
      operationId: "getStoreProducts"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "匹配商品名、SPU/SKU code"
        -
          name: "brand_id"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "品牌 ID"
        -
          name: "category_id"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "一级分类 ID"
        -
          name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "HOT"
              - "NEWEST"
              - "PRICE_ASC"
              - "PRICE_DESC"
          description: "默认 NEWEST；相同值按 product_id ASC"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreProductListResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/products/{product_id}:
    get:
      tags:
        - "Store"
      summary: "商品详情及全部可售 SKU"
      operationId: "getStoreProductsByProductId"
      security: []
      parameters:
        -
          name: "product_id"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoreProductDetailResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/favorites:
    get:
      tags:
        - "Store"
      summary: "收藏列表"
      operationId: "getStoreFavorites"
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PageSize"
        -
          name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
          description: "商品名关键词"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FavoriteListResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /store/favorites/{product_id}:
    put:
      tags:
        - "Store"
      summary: "幂等收藏"
      operationId: "putStoreFavoritesByProductId"
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: "product_id"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
