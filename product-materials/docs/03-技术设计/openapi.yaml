    ReturnInspectionLine:
      type: "object"
      additionalProperties: false
      required:
        - "order_item_id"
        - "received_qty"
        - "approved_refund_qty"
        - "restock_qty"
        - "damaged_qty"
        - "scrap_qty"
        - "return_to_customer_qty"
      properties:
        order_item_id:
          type: "string"
        received_qty:
          type: "integer"
          minimum: 0
        approved_refund_qty:
          type: "integer"
          minimum: 0
          description: "验货时冻结的可退款数量；必须等于回库、损坏、报废数量之和，且与退回客户数量之和等于实收数量。"
        restock_qty:
          type: "integer"
          minimum: 0
        damaged_qty:
          type: "integer"
          minimum: 0
        scrap_qty:
          type: "integer"
          minimum: 0
        return_to_customer_qty:
          type: "integer"
          minimum: 0
        note:
          type:
            - "string"
            - "null"
          maxLength: 500
      description: "批准退款数量必须等于回库、损坏、报废之和；批准退款数量与退回客户数量之和、四类处置数量之和都必须等于 received_qty。PASS 必须全量实收并全量批准退款；少件、0 件或其他不符必须 ABNORMAL。"
    ReturnInspectionRequest:
      type: "object"
      additionalProperties: false
      required:
        - "result"
        - "items"
        - "evidence_file_ids"
      properties:
        result:
          type: "string"
          enum:
            - "PASS"
            - "ABNORMAL"
        abnormal_reason:
          type:
            - "string"
            - "null"
          maxLength: 500
        items:
          type: "array"
          minItems: 1
          uniqueItems: true
          description: "必须在同一事务中精确覆盖该售后的全部 aftersale_item，每个 order_item_id 恰好出现一次，不允许遗漏、重复或额外项。"
          items:
            "$ref": "#/components/schemas/ReturnInspectionLine"
        evidence_file_ids:
          type: "array"
          uniqueItems: true
          description: "服务端校验 READY/purpose/归属后按 canonical 顺序封存完整集合；验货提交后不得追加、删除、换序或替换。"
          items:
            type: "string"
      allOf:
        -
          if:
            properties:
              result:
                const: "ABNORMAL"
          then:
            required:
              - "abnormal_reason"
            properties:
              abnormal_reason:
                type: "string"
                minLength: 2
              evidence_file_ids:
                minItems: 1
    ContinueRefundRequest:
      type: "object"
      additionalProperties: false
      required:
        - "resolution"
        - "reason"
      description: "配合必填 If-Match 使用验货记录中已冻结的逐项 approved_refund_qty 继续退款，不允许在此接口提高数量；聚合版本冲突返回 409。"
      properties:
