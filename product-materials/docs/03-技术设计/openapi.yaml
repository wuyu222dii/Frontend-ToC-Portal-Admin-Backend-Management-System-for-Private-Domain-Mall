  /files/{file_id}/complete:
    post:
      tags:
        - "Files"
      summary: "校验类型、大小和哈希后确认上传"
      description: "请求 sha256/size 必须同时与上传意图及服务端读取对象后的实测 MIME、魔数、大小和 SHA-256 一致；不一致返回 422 FILE_CONTENT_MISMATCH。PRODUCT_IMAGE、BRAND_LOGO、CATEGORY_ICON、BANNER 移至 public/；AFTERSALE_EVIDENCE、WITHDRAWAL_PROOF、PROMOTION_QR 移至 private/；对象键均不含原文件名。FILE_UPLOAD_COMPLETE 使用闭合幂等策略：同 Idempotency-Key 精确重放，已完成文件使用新键重复提交返回 409；不得在数据库新增 completed_at 列。"
      operationId: "postFilesByFileIdComplete"
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: "file_id"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UploadCompleteRequest"
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
            Pragma:
              "$ref": "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileUploadCompleteResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
  /files/{file_id}/download-url:
    get:
      tags:
        - "Files"
      summary: "按角色和业务对象返回短时签名 URL"
      description: "仅 READY 且通过角色和业务归属校验的文件可下载。private/ 对象返回有效期 5 分钟的签名 URL；公开素材的稳定地址由 FileUploadCompleteResponse.public_url 提供。本 GET operation 不接受 Idempotency-Key、不创建幂等记录；响应必须 no-store/private，且不得持久化或记录签名 URL。存储桶默认私有，仅 public/* 允许匿名 GET，private/* 始终禁止匿名访问。PENDING 或 staging/ 满 24 小时仅进入清理候选，删除前必须再次确认没有 READY 引用。"
      operationId: "getFilesByFileIdDownloadUrl"
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: "file_id"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
      responses:
        200:
          description: "成功"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
            Pragma:
              "$ref": "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileDownloadUrlResponse"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/NotFound"
        409:
          "$ref": "#/components/responses/StateConflict"
        422:
          "$ref": "#/components/responses/BusinessError"
        429:
          "$ref": "#/components/responses/RateLimited"
        500:
          "$ref": "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "B7 新增的 /store 路径仅接受 aud=qingxu-store、role=CUSTOMER、assurance=WECHAT；/admin 继续仅接受 aud=qingxu-admin-web、role=SUPER_ADMIN、assurance=MFA。B7 不修改 /agent 现有 operation 的身份与会话契约。不得跨端复用或通过 B7 放宽 B2 会话。"
    preAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "PreAuth"
    candidateToken:
      type: "apiKey"
      in: "header"
      name: "X-Candidate-Token"
      description: "游客归属候选的高熵 token，长度 32..512；只在候选创建响应中签发一次，服务端仅保存 domain-separated HMAC，固定 30 分钟失效。GET 查询不消费 token；候选替换或登录迁移会原子失效 token hash，后续确认/拒绝消费已迁移的候选事实而不复用 token。candidate token、幂等请求和 IP 限流使用互不相同的 scope/domain。"
    wechatSignature:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Signature"
    wechatTimestamp:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Timestamp"
    wechatNonce:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Nonce"
    wechatSerial:
      type: "apiKey"
      in: "header"
      name: "Wechatpay-Serial"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        pattern: "^\\\"[1-9][0-9]*\\\"$"
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    PageSize:
      name: "page_size"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Timezone:
      name: "timezone"
      in: "query"
      schema:
        type: "string"
        enum:
          - "Asia/Shanghai"
        default: "Asia/Shanghai"
    WechatTimestamp:
      name: "Wechatpay-Timestamp"
      in: "header"
      required: true
      schema:
        type: "string"
    WechatNonce:
      name: "Wechatpay-Nonce"
      in: "header"
      required: true
      schema:
        type: "string"
    WechatSerial:
      name: "Wechatpay-Serial"
      in: "header"
      required: true
      schema:
        type: "string"
  headers:
    CacheControlNoStore:
      description: "响应含认证令牌、短时能力、签名 URL、敏感明文或一次性确认 token，不得缓存。"
      schema:
        const: "no-store, private"
    PragmaNoCache:
      description: "兼容旧客户端和中间代理的禁止缓存指令。"
      schema:
        const: "no-cache"
    StoreCacheControlNoStoreRequired:
      description: "B7 Store 响应必返的禁止缓存指令。"
      required: true
      schema:
        const: "no-store, private"
    StorePragmaNoCacheRequired:
      description: "B7 Store 响应必返的兼容禁止缓存指令。"
      required: true
      schema:
        const: "no-cache"
  responses:
    BadRequest:
      description: "参数或签名头格式错误"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "未登录、会话失效或 Provider 验签失败"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "RBAC、数据范围、MFA 或 reauth grant 不满足"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "资源不存在或当前主体无权查看"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    StateConflict:
      description: "状态、版本、幂等请求哈希或唯一约束冲突；CH-006 固定冲突码包括 SOFT_DELETED_KEY_RESERVED。"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    StoreSensitiveError:
      description: "B7 Store 敏感操作的通用错误；不得缓存或回显被拒绝的敏感值。"
      headers:
        Cache-Control:
          description: "敏感错误响应不得缓存。"
          required: true
          schema:
            const: "no-store, private"
        Pragma:
          description: "兼容旧客户端和中间代理的禁止缓存指令。"
          required: true
          schema:
            const: "no-cache"
      content:
        application/json:
          schema:
            type: "object"
            additionalProperties: false
            required: ["code", "message", "request_id"]
            properties:
              code:
                type: "string"
              message:
                type: "string"
              details:
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  required: ["field", "reason"]
                  properties:
                    field:
                      type: ["string", "null"]
                    reason:
                      type: "string"
                    rejected_value:
                      type: "null"
              request_id:
                type: "string"
    StoreLoginConflict:
      description: "消费者微信登录的闭合冲突响应。"
      headers:
        Cache-Control:
          required: true
          schema:
            const: "no-store, private"
        Pragma:
          required: true
          schema:
            const: "no-cache"
      content:
        application/json:
          schema:
            type: "object"
            additionalProperties: false
            required: ["code", "message", "request_id"]
            properties:
              code:
                type: "string"
                enum: ["CONSENT_VERSION_MISMATCH", "ATTRIBUTION_CANDIDATE_MISMATCH", "STATE_CONFLICT"]
              message:
                type: "string"
              details:
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  required: ["field", "reason"]
                  properties:
                    field:
                      type: ["string", "null"]
                    reason:
                      type: "string"
                    rejected_value:
                      type: "null"
              request_id:
                type: "string"
    StorePhoneAuthorizationConflict:
      description: "消费者手机号授权的闭合协议或版本冲突响应。"
      headers:
        Cache-Control:
          required: true
          schema:
            const: "no-store, private"
        Pragma:
          required: true
          schema:
            const: "no-cache"
      content:
        application/json:
          schema:
            type: "object"
            additionalProperties: false
            required: ["code", "message", "request_id"]
            properties:
              code:
                type: "string"
                enum: ["CONSENT_VERSION_MISMATCH", "RESOURCE_VERSION_CONFLICT", "STATE_CONFLICT"]
              message:
                type: "string"
              details:
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  required: ["field", "reason"]
                  properties:
                    field:
                      type: ["string", "null"]
                    reason:
                      type: "string"
                    rejected_value:
                      type: "null"
              request_id:
                type: "string"
    StoreAttributionCandidateConflict:
      description: "消费者归因候选绑定不匹配或幂等状态冲突的闭合响应。"
      headers:
        Cache-Control:
          required: true
          schema:
            const: "no-store, private"
        Pragma:
          required: true
          schema:
            const: "no-cache"
      content:
        application/json:
          schema:
            type: "object"
            additionalProperties: false
            required: ["code", "message", "request_id"]
            properties:
              code:
                type: "string"
                enum: ["ATTRIBUTION_CANDIDATE_MISMATCH", "STATE_CONFLICT"]
              message:
                type: "string"
              details:
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  required: ["field", "reason"]
                  properties:
                    field:
                      type: ["string", "null"]
                    reason:
                      type: "string"
                    rejected_value:
                      type: "null"
              request_id:
                type: "string"
    StoreAccountDeletionBlocked:
      description: "账号删除 confirm 在事务内重检发现业务阻断时的闭合响应。"
      headers:
        Cache-Control:
          required: true
          schema:
            const: "no-store, private"
        Pragma:
          required: true
          schema:
            const: "no-cache"
      content:
        application/json:
          schema:
            type: "object"
            additionalProperties: false
            required: ["code", "message", "request_id"]
            properties:
              code:
                const: "ACCOUNT_DELETION_BLOCKED"
              message:
                type: "string"
              details:
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  required: ["field", "reason"]
                  properties:
                    field:
                      type: ["string", "null"]
                    reason:
                      type: "string"
                    rejected_value:
                      type: "null"
              request_id:
                type: "string"
    BusinessError:
      description: "库存、售后额度、金额分配或业务前置校验失败；固定业务码包括 ACTIVE_PRODUCT_DEPENDENCY、FILE_CONTENT_MISMATCH，CH-010 的 PRODUCT_PRIMARY_IMAGE_REQUIRED、PRODUCT_ACTIVE_SKU_REQUIRED、ACTIVE_SKU_DEPENDENCY、ACTIVE_INVENTORY_RESERVATION，以及 CH-012 的 INVENTORY_QUANTITY_OUT_OF_RANGE；库存确认低于锁定量继续使用 STOCK_INSUFFICIENT（均为 422）。"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "访问、登录或 MFA 失败次数受限"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    StoreRateLimited:
      description: "五个匿名目录 GET（/store/home、/store/categories、/store/brands、/store/products、/store/products/{product_id}）共享 Redis 固定窗口：仅保存 HMAC 后的来源 IP，每个来源每 60 秒最多 120 次；超限返回 429 及距当前窗口结束的准确 Retry-After 整数秒，Redis 计数不可用时不得绕过限流。"
      headers:
        Retry-After:
          description: "距当前 60 秒固定窗口结束的准确剩余整数秒。"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    StoreLegalRateLimited:
      description: "匿名法务文档读取使用 Redis 固定窗口及独立 key namespace；仅保存来源 IP 的 HMAC，每个来源每 60 秒最多 120 次。超限返回距当前窗口结束的准确 Retry-After 整数秒；Redis 不可用时 fail closed。"
      headers:
        Retry-After:
          description: "距当前 60 秒固定窗口结束的准确剩余整数秒。"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    StoreLoginRateLimited:
      description: "消费者登录使用 Redis 固定窗口及独立 key namespace；仅保存来源 IP 的 HMAC，每个来源每 15 分钟最多 10 次。超限返回距当前窗口结束的准确 Retry-After 整数秒；Redis 不可用时 fail closed。"
      headers:
        Cache-Control:
          description: "登录失败响应不得缓存。"
          required: true
          schema:
            const: "no-store, private"
        Pragma:
          description: "兼容旧客户端和中间代理的禁止缓存指令。"
          required: true
          schema:
            const: "no-cache"
        Retry-After:
          description: "距当前 15 分钟固定窗口结束的准确剩余整数秒。"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 900
      content:
        application/json:
          schema:
            allOf:
              -
                "$ref": "#/components/schemas/ErrorResponse"
              -
                type: "object"
                properties:
                  code:
                    const: "RATE_LIMITED"
                  details:
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: false
                      required: ["field", "reason"]
                      properties:
                        field:
                          type: ["string", "null"]
                        reason:
                          type: "string"
                        rejected_value:
                          type: "null"
    InternalError:
      description: "未预期错误；响应不暴露堆栈、SQL 或 Provider 原文"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "request_id"
      properties:
        code:
          type: "string"
        message:
          type: "string"
        details:
          type: "array"
          items:
            "$ref": "#/components/schemas/ErrorDetail"
        request_id:
          type: "string"
    ErrorDetail:
      type: "object"
      additionalProperties: false
      required:
        - "field"
        - "reason"
      properties:
        field:
          type:
            - "string"
            - "null"
        reason:
          type: "string"
        rejected_value:
          type:
            - "string"
            - "null"
          description: "仅可回显非敏感校验值。当 field 为密码、验证码、登录 code、candidate_token、provider_credential、invite_code、preview_token、confirmation_hash、refresh/access token 或 reauth_grant 等敏感字段时，必须省略 rejected_value 或返回 null，禁止回显原值。"
      x-sensitive-field-policy:
        forbidden-rejected-value-fields: ["password", "new_password", "totp_code", "recovery_code", "code", "candidate_token", "provider_credential", "invite_code", "preview_token", "confirmation_hash", "refresh_token", "access_token", "reauth_grant"]
    CommandResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "resource_type"
            - "resource_id"
            - "status"
            - "version"
            - "occurred_at"
          properties:
            resource_type:
              type: "string"
            resource_id:
              type: "string"
            status:
              type: "string"
            version:
              type: "integer"
              minimum: 1
            occurred_at:
              type: "string"
              format: "date-time"
        request_id:
          type: "string"
    InventoryAdjustmentCommandResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "resource_type"
            - "resource_id"
            - "status"
            - "version"
            - "occurred_at"
          properties:
            resource_type:
              const: "inventory"
            resource_id:
              type: "string"
              description: "与路径 sku_id 相同。"
            status:
              const: "SUCCEEDED"
            version:
              type: "integer"
              minimum: 1
              description: "调整成功后的 inventory_balance.version。"
            occurred_at:
              type: "string"
              format: "date-time"
        request_id:
          type: "string"
    PositiveMoney:
      type: "string"
      pattern: "^(?:0\\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,15}\\.[0-9]{2})$"
    NonNegativeMoney:
      type: "string"
      pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
    SignedMoney:
      type: "string"
      pattern: "^-?(?:0|[1-9][0-9]*)\\.[0-9]{2}$"
    RatePercentValue:
      type: "string"
      pattern: "^(?:100\\.0000|(?:0|[1-9][0-9]?)\\.[0-9]{4})$"
      examples:
        - "0.0000"
        - "12.5000"
        - "100.0000"
    PaginationView:
      type: "object"
      additionalProperties: false
      required: ["page", "page_size", "total"]
      properties:
        page:
          type: "integer"
          minimum: 1
        page_size:
          type: "integer"
          minimum: 1
          maximum: 100
        total:
          type: "integer"
          minimum: 0
    LegalDocumentsResponse:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
        - "request_id"
      properties:
        code:
          const: "OK"
        message:
          const: "success"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "user_agreement"
            - "privacy_policy"
            - "phone_authorization"
          properties:
            user_agreement:
              type: "object"
              additionalProperties: false
              required:
                - "type"
                - "document_version"
                - "title"
                - "content_url"
                - "required"
              properties:
                type:
                  const: "USER_AGREEMENT"
                document_version:
                  type: "string"
                  minLength: 1
                  maxLength: 80
                title:
                  type: "string"
                  minLength: 1
                  maxLength: 120
                content_url:
                  type: "string"
                  format: "uri"
                  pattern: "^https://"
                  maxLength: 500
                required:
                  const: true
            privacy_policy:
              type: "object"
              additionalProperties: false
              required:
                - "type"
                - "document_version"
                - "title"
                - "content_url"
                - "required"
              properties:
                type:
                  const: "PRIVACY_POLICY"
                document_version:
                  type: "string"
                  minLength: 1
                  maxLength: 80
                title:
                  type: "string"
                  minLength: 1
                  maxLength: 120
                content_url:
                  type: "string"
                  format: "uri"
                  pattern: "^https://"
                  maxLength: 500
                required:
                  const: true
            phone_authorization:
              type: "object"
              additionalProperties: false
              required:
                - "type"
                - "document_version"
                - "title"
                - "content_url"
                - "required"
              properties:
                type:
                  const: "PHONE_AUTHORIZATION"
                document_version:
                  type: "string"
                  minLength: 1
                  maxLength: 80
                title:
                  type: "string"
                  minLength: 1
                  maxLength: 120
                content_url:
                  type: "string"
                  format: "uri"
                  pattern: "^https://"
                  maxLength: 500
                required:
                  const: true
        request_id:
          type: "string"
    ConsentInput:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "document_version"
        - "accepted"
      properties:
        type:
          type: "string"
          enum:
            - "USER_AGREEMENT"
            - "PRIVACY_POLICY"
            - "PHONE_AUTHORIZATION"
        document_version:
          type: "string"
          minLength: 1
          maxLength: 80
        accepted:
          const: true
    WechatLoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "consents"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 512
          writeOnly: true
        candidate_token:
          type:
            - "string"
            - "null"
          minLength: 32
          maxLength: 512
          writeOnly: true
        consents:
          type: "array"
          minItems: 2
          maxItems: 2
          prefixItems:
            -
              allOf:
                -
